<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S3 Serverless WebApp</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem; }
    table { border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 4px 16px; text-align: left; }
    th { border-bottom: 2px solid #333; }
  </style>
</head>
<body>

  <div id="loginSection">
    <h1>Log in</h1>
    <form id="loginForm">
      <input type="password" id="tokenInput" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
  </div>

  <div id="appSection" style="display: none;">
    <h1>Upload a file to S3</h1>
    <p>Bucket: <code id="bucket-name"></code></p>
    <form id="uploadForm">
      <input type="file" id="fileInput" required>
      <button type="submit">Upload</button>
    </form>
    <div id="list"></div>
  </div>

  <script>
    // EDIT ME: paste each Lambda Function URL (keep the trailing slash).
    const LOGIN_URL       = "https://orov5ynge2sjracmu6chdf3hoe0ohjls.lambda-url.ap-southeast-1.on.aws/";
    const BUCKET_NAME_URL = "https://dnuygk7cax2owbjsfeti4wbabe0oxtoo.lambda-url.ap-southeast-1.on.aws/";
    const LIST_URL        = "https://ewxuwlkar6dqdisrydzopfcuia0ugdru.lambda-url.ap-southeast-1.on.aws/";
    const UPLOAD_URL      = "https://bdps5pr2klxsv4gorlnzfovtiq0xfhtt.lambda-url.ap-southeast-1.on.aws/";
    const DOWNLOAD_URL    = "https://fuakb3n7mctfrrrhfbwqdxqqwu0ijhvv.lambda-url.ap-southeast-1.on.aws/";

    // Token is kept only in memory (not localStorage/cookie): reload = log in again.
    let token = null;

    function authHeaders() {
      return { "Authorization": "Bearer " + token };
    }

    function showError(response) {
      response.text().then(text => alert(text));
    }

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const submittedToken = document.getElementById("tokenInput").value;

      fetch(LOGIN_URL, { method: "POST", body: submittedToken })
        .then(response => {
          if (response.ok) {
            token = submittedToken;
            document.getElementById("loginSection").style.display = "none";
            document.getElementById("appSection").style.display = "block";
            showBucketName();
            listObjects();
          } else {
            showError(response);
          }
        })
        .catch(error => alert("Error: " + error));
    });

    function showBucketName() {
      fetch(BUCKET_NAME_URL, { headers: authHeaders() })
        .then(response => {
          if (response.ok) {
            response.text().then(text => {
              document.getElementById("bucket-name").textContent = text;
            });
          } else {
            showError(response);
          }
        })
        .catch(error => alert("Error: " + error));
    }

    function listObjects() {
      fetch(LIST_URL, { headers: authHeaders() })
        .then(response => {
          if (!response.ok) { showError(response); return; }
          response.json().then(objects => {
            const table = document.createElement("table");
            table.innerHTML = "<tr><th>Key</th><th>Size</th><th>Last modified</th><th></th></tr>";
            for (const object of objects) {
              const tr = document.createElement("tr");
              for (const value of [object.key, object.size, object.lastModified]) {
                const td = document.createElement("td");
                td.textContent = value;
                tr.appendChild(td);
              }
              const td = document.createElement("td");
              const btn = document.createElement("button");
              btn.textContent = "Download";
              btn.addEventListener("click", () => downloadObject(object.key));
              td.appendChild(btn);
              tr.appendChild(td);
              table.appendChild(tr);
            }
            document.getElementById("list").replaceChildren(table);
          });
        })
        .catch(error => alert("Error: " + error));
    }

    // Download needs the Authorization header, so a plain <a href> won't work:
    // fetch the file, then hand the blob to the browser as a download.
    function downloadObject(key) {
      fetch(DOWNLOAD_URL + "?key=" + encodeURIComponent(key), { headers: authHeaders() })
        .then(response => {
          if (!response.ok) { showError(response); return; }
          response.blob().then(blob => {
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = key;
            a.click();
            URL.revokeObjectURL(a.href);
          });
        })
        .catch(error => alert("Error: " + error));
    }

    // Upload: raw file bytes as the body, file name in the X-Filename header.
    document.getElementById("uploadForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const file = document.getElementById("fileInput").files[0];
      fetch(UPLOAD_URL, {
        method: "POST",
        headers: { ...authHeaders(), "X-Filename": file.name },
        body: file
      })
        .then(response => {
          if (response.ok) {
            event.target.reset();
            listObjects();
          } else {
            showError(response);
          }
        })
        .catch(error => alert("Error: " + error));
    });
  </script>
</body>
</html>
